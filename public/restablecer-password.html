<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña · ActivoX</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      margin-top: 4px;
    }
    .ok-caja { color: var(--ok); font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-pantalla">
    <form id="form-reset" class="login-caja">
      <h1>🔑 Restablecer contraseña</h1>

      <div id="sin-token" style="display:none;">
        <p class="login-error" style="color: var(--text-muted);">
          Este enlace no trae token. Pide uno nuevo desde "¿Olvidaste tu contraseña?" en la app o en el inicio de sesión.
        </p>
      </div>

      <div id="con-token">
        <label>
          Nueva contraseña
          <input type="password" id="password" autocomplete="new-password" required minlength="6" />
        </label>
        <label>
          Confirmar contraseña
          <input type="password" id="password2" autocomplete="new-password" required minlength="6" />
        </label>
        <p class="login-error" id="error"></p>
        <p class="ok-caja" id="ok" style="display:none;">Contraseña actualizada ✔. Ya puedes iniciar sesión en la app.</p>
        <button type="submit" class="btn-primario" id="btn-enviar">Guardar nueva contraseña</button>
      </div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const form = document.getElementById('form-reset');
    const errorEl = document.getElementById('error');
    const okEl = document.getElementById('ok');
    const btn = document.getElementById('btn-enviar');

    if (!token) {
      document.getElementById('sin-token').style.display = 'block';
      document.getElementById('con-token').style.display = 'none';
    }

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errorEl.textContent = '';
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password.length < 6) {
        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
      }
      if (password !== password2) {
        errorEl.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/restablecer-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo restablecer la contraseña');

        form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
        okEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
